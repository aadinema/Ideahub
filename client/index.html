<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IdeaHub — MPOnline's Enterprise Innovation & Ideation Management Platform. Submit ideas, track innovation, drive change." />
    <meta name="theme-color" content="#F8F9FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F1A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>IdeaHub — Innovation Platform</title>
    <!--
      No external font/stylesheet links. The server CSP is style-src 'self' and
      font-src 'self' (server/middleware/securityHeaders.js), so Google Fonts would
      be blocked in any deployment served through Express and produce console CSP
      errors. Typography uses the platform UI font stack (see index.css).
    -->
  </head>
  <body class="antialiased">
    <script>
      // Prevent FOUC: apply theme before first paint
      (function(){var t=localStorage.getItem('ideahub-theme');if(t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark')}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
