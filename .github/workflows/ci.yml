name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  MONGODB_URI: mongodb://localhost:27017/ideahub-test
  JWT_ACCESS_SECRET: test-secret-access-key-do-not-use-in-production
  CLIENT_ORIGIN: http://localhost:5173
  PORT: 5000

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      # 2. Setup Node.js (Vite 8 requires ^20.19.0 || >=22.12.0)
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            e2e/package-lock.json

      # 3. Install dependencies (client, server, e2e — root has no lockfile)
      - name: Install dependencies
        run: |
          cd client && npm ci && cd ..
          cd server && npm ci && cd ..
          cd e2e && npm ci && cd ..

      # 4. Client: Build
      - name: Client build
        run: cd client && npm run build

      # 5. Client: Unit tests
      - name: Client unit tests
        run: cd client && npm run test

      # 6. Server: Unit/API tests
      - name: Server unit tests
        run: cd server && npm run test

      # 7. Dependency audit (informational — reports, does not gate)
      - name: Dependency audit
        continue-on-error: true
        run: |
          cd client && npm audit --audit-level=moderate || true
          cd ../server && npm audit --audit-level=moderate || true
          cd ../e2e && npm audit --audit-level=moderate || true

      # 8. Secret scanning (gating)
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true
          verbose: true

      # 9. E2E: seed database
      - name: E2E seed database
        run: cd server && npm run seed

      # 10. E2E: install Playwright browsers
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      # 11. E2E smoke tests (client is started by Playwright's webServer)
      - name: E2E smoke tests
        run: cd e2e && npm run test:smoke

      # 12. Upload E2E results
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'
      - uses: github/codeql-action/analyze@v3
