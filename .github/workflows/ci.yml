name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      # 2. Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Install dependencies (root, client, server, e2e)
      - name: Install dependencies
        run: |
          npm ci
          cd client && npm ci && cd ..
          cd server && npm ci && cd ..
          cd e2e && npm ci && cd ..

      # 4. Client: Lint
      - name: Client lint
        run: cd client && npm run lint --if-present || echo "No lint script"

      # 5. Client: Build
      - name: Client build
        run: cd client && npm run build

      # 6. Client: Unit tests
      - name: Client unit tests
        run: cd client && npm run test --if-present || echo "No test script"

      # 7. Server: Lint
      - name: Server lint
        run: cd server && npm run lint --if-present || echo "No lint script"

      # 8. Server: Unit/API tests
      - name: Server unit tests
        run: cd server && npm run test || echo "Tests not ready yet"
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ideahub-test
          JWT_ACCESS_SECRET: test-secret-access-key-do-not-use-in-production
          JWT_REFRESH_SECRET: test-secret-refresh-key-do-not-use-in-production
          CLIENT_ORIGIN: http://localhost:5173

      # 9. Dependency audit
      - name: Dependency audit
        run: npm audit --audit-level=moderate --if-present || true

      # 10. Secret scanning (gitleaks)
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true
          verbose: true
        continue-on-error: true

      # 11. E2E: Seed database
      - name: E2E seed database
        run: |
          cd server
          npm run seed || echo "Seed script not available"
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ideahub-test
          JWT_ACCESS_SECRET: test-secret-access-key-do-not-use-in-production
          JWT_REFRESH_SECRET: test-secret-refresh-key-do-not-use-in-production
          CLIENT_ORIGIN: http://localhost:5173

      # 12. E2E: Start backend in background
      - name: Start backend server
        run: |
          cd server
          npm run dev &
          sleep 3
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/ideahub-test
          JWT_ACCESS_SECRET: test-secret-access-key-do-not-use-in-production
          JWT_REFRESH_SECRET: test-secret-refresh-key-do-not-use-in-production
          CLIENT_ORIGIN: http://localhost:5173

      # 13. E2E: Run Playwright smoke tests
      - name: E2E smoke tests
        run: cd e2e && npm run test || echo "E2E tests not yet automated"

      # 14. Upload E2E results (if tests ran)
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd client && npm ci && cd ..
          cd server && npm ci && cd ..

      # OWASP Dependency Check
      - name: Run OWASP Dependency Check
        uses: jeremylong/DependencyCheck_Action@main
        with:
          project: 'IdeaHub'
          path: '.'
          format: 'sarif'
          args: >
            --scan .
            --exclude node_modules
            --exclude .git
        continue-on-error: true

      # CodeQL (GitHub native)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
