<rect x="853" y="330" width="123" height="18" rx="5" fill="#f8fafc"/>
<text x="915" y="344" font-size="11" fill="#475569" text-anchor="middle">Reject · ≥20 chars</text>
<rect x="889" y="538" width="52" height="18" rx="5" fill="#f8fafc"/>
<text x="915" y="552" font-size="11" fill="#475569" text-anchor="middle">Reject</text>
<rect x="853" y="746" width="123" height="18" rx="5" fill="#f8fafc"/>
<text x="915" y="760" font-size="11" fill="#475569" text-anchor="middle">Reject · ≥20 chars</text>
<text x="915" y="893" font-size="11" fill="#475569" text-anchor="middle">approve-implementation</text>
<rect x="40" y="1570" width="1420" height="210" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="66" y="1602" font-size="15" font-weight="700" fill="#1e1b4b">Defects found while tracing this flow — all three now fixed and regression-tested</text>
<text x="70" y="1629" font-size="13" font-weight="700" fill="#059669">✗</text>
<text x="92" y="1628" font-size="12.5" font-weight="600" fill="#1e293b">Resubmitting a returned idea always 422s.</text>
<text x="92" y="1645" font-size="11.5" fill="#64748b">ideaController.js accepted RETURNED, but _submitIdea asked for SUBMITTED first and STATUS_TRANSITIONS[RETURNED] holds only UNDER_SUPERVISOR_REVIEW. FIXED (KI-020): submitIdea() now branches, sending a returned idea straight back to review.</text>
<text x="70" y="1676" font-size="13" font-weight="700" fill="#059669">✗</text>
<text x="92" y="1675" font-size="12.5" font-weight="600" fill="#1e293b">Every committee defer was logged as ADMIN_OVERRIDE.</text>
<text x="92" y="1692" font-size="11.5" fill="#64748b">deferIdea passed isAdminOverride: true on a declared edge, so an ordinary committee decision was stamped as an override in the admin audit viewer. FIXED (KI-021): the flag is gone; the hop runs as the automated transition but keeps the committee member's id.</text>
<text x="70" y="1723" font-size="13" font-weight="700" fill="#059669">✗</text>
<text x="92" y="1722" font-size="12.5" font-weight="600" fill="#1e293b">approve-implementation stranded the idea after creating the Implementation record.</text>
<text x="92" y="1739" font-size="11.5" fill="#64748b">The auto-transition to IMPLEMENTATION_INITIATED used actor: req.user, but the status is gated to ['system', ADMIN] — a 403 fired after the row was written. FIXED (KI-022): the hop now uses a system actor carrying the committee member's id.</text>
<text x="1100" y="1556" font-size="12.5" font-weight="700" fill="#334155">Legend</text>
<rect x="1100" y="1526" width="26" height="14" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
<text x="1133" y="1537" font-size="11" fill="#64748b">Human-gated stage</text>
<rect x="1300" y="1526" width="26" height="14" rx="4" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1333" y="1537" font-size="11" fill="#64748b">Automatic hop (never user-facing)</text>
<rect x="1100" y="1548" width="26" height="14" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="1133" y="1559" font-size="11" fill="#64748b">Published / live</text>
<rect x="1300" y="1548" width="26" height="14" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="1333" y="1559" font-size="11" fill="#64748b">Terminal — no outgoing edge</text>
<rect x="1100" y="1570" width="26" height="14" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="1133" y="1581" font-size="11" fill="#64748b">Loops back to the employee</text>
<rect x="1300" y="1570" width="26" height="14" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="1333" y="1581" font-size="11" fill="#64748b">Unreachable: no endpoint</text>
